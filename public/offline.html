<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F8F5EF" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Amara · Offline</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #F8F5EF;
        color: #282621;
        font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      }
      main {
        width: min(100%, 420px);
        padding: 40px 28px;
        text-align: center;
        border: 1px solid #E0D5C8;
        border-radius: 24px;
        background: #FFFDF8;
        box-shadow: 0 16px 48px rgba(91, 65, 47, 0.08);
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 24px;
        border-radius: 20px;
      }
      h1 { margin: 0; font-size: 24px; font-weight: 500; letter-spacing: 0.02em; }
      p { margin: 14px 0 0; color: #756F66; font-size: 14px; line-height: 1.8; }
      a {
        display: inline-block;
        margin-top: 26px;
        padding: 11px 22px;
        border-radius: 14px;
        background: #A34F3D;
        color: #FFFDF8;
        text-decoration: none;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="/icons/icon-192.png" alt="" width="64" height="64" />
      <h1>You’re offline</h1>
      <p>Amara will be here when you reconnect.<br />当前处于离线状态，重新连接后再继续。</p>
      <a href="/">Try again · 重试</a>
    </main>
  </body>
</html>
